<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Manajemen Kos Al-Firdaus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface-container-lowest": "#ffffff",
          "primary-hover": "#1D4ED8",
          "error": "#ba1a1a",
          "on-primary": "#ffffff",
          "on-surface-variant": "#434655",
          "border-base": "#E5E7EB",
          "text-main": "#111827",
          "primary-light": "#EFF6FF",
          "primary": "#004ac6",
          "on-surface": "#191b23",
          "bg-canvas": "#F9FAFB",
          "danger": "#DC2626",
          "danger-bg": "#FEF2F2",
          "success": "#16A34A",
          "success-bg": "#F0FDF4",
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: { "stack-md": "16px", "stack-lg": "24px", "stack-sm": "8px" },
        fontFamily: { body: ["Inter"], "page-title": ["Inter"], "section-title": ["Inter"], "label-muted": ["Inter"] },
        fontSize: {
          "page-title": ["20px", { lineHeight: "28px", fontWeight: "600" }],
          "label-muted": ["12px", { lineHeight: "16px", fontWeight: "400" }],
          "section-title": ["16px", { lineHeight: "24px", fontWeight: "600" }],
          "body": ["14px", { lineHeight: "20px", fontWeight: "400" }],
        }
      }
    }
  }
</script>
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-bg-canvas flex items-center justify-center p-stack-lg font-body text-body text-text-main">

<div class="w-full max-w-[400px] bg-surface-container-lowest border border-border-base rounded-lg p-8 flex flex-col gap-stack-lg shadow-sm">
  
  <!-- Header -->
  <div class="flex flex-col items-center text-center gap-stack-sm">
    <div class="w-12 h-12 bg-primary-light text-primary rounded-full flex items-center justify-center mb-2">
      <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">business</span>
    </div>
    <h1 class="font-page-title text-page-title text-on-surface">Manajemen Kos Al-Firdaus</h1>
    <p class="font-body text-body text-on-surface-variant">Masuk ke akun Anda untuk melanjutkan</p>
  </div>

  <!-- Alert Error -->
  <div id="alert-error" class="hidden bg-danger-bg border border-danger text-danger text-sm rounded px-4 py-3 flex items-center gap-2">
    <span class="material-symbols-outlined text-[18px]">error</span>
    <span id="alert-error-msg">Email atau password salah.</span>
  </div>

  <!-- Alert Success -->
  <div id="alert-success" class="hidden bg-success-bg border border-success text-success text-sm rounded px-4 py-3 flex items-center gap-2">
    <span class="material-symbols-outlined text-[18px]">check_circle</span>
    <span>Login berhasil! Mengalihkan ke dashboard...</span>
  </div>

  <!-- Form -->
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label class="font-label-muted text-label-muted text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
      <input class="w-full h-10 px-3 bg-surface-container-lowest border border-border-base rounded text-text-main font-body text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" 
             id="email" placeholder="nama@email.com" type="email"/>
    </div>
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center justify-between">
        <label class="font-label-muted text-label-muted text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
      </div>
      <input class="w-full h-10 px-3 bg-surface-container-lowest border border-border-base rounded text-text-main font-body text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" 
             id="password" placeholder="••••••••" type="password"/>
    </div>
    <div class="pt-2">
      <button id="btn-login"
              class="w-full h-10 bg-primary hover:bg-primary-hover text-on-primary font-section-title text-section-title rounded transition-colors flex items-center justify-center gap-2"
              type="button">
        <span id="btn-login-text">Login</span>
        <span id="btn-login-icon" class="material-symbols-outlined text-[18px]">arrow_forward</span>
        <svg id="btn-login-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-center border-t border-border-base pt-6 mt-2">
    <p class="font-body text-body text-on-surface-variant">
      Belum punya akun? <a class="text-primary hover:text-primary-hover font-semibold transition-colors" href="register.html">Daftar</a>
    </p>
  </div>

</div>

<script src="js/auth.js"></script>
<script>
  // Jika sudah login, langsung redirect ke dashboard
  if (localStorage.getItem('token')) {
    window.location.href = 'index.html';
  }

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btnText    = document.getElementById('btn-login-text');
    const btnIcon    = document.getElementById('btn-login-icon');
    const btnSpinner = document.getElementById('btn-login-spinner');
    const alertErr   = document.getElementById('alert-error');
    const alertErrMsg= document.getElementById('alert-error-msg');
    const alertOk    = document.getElementById('alert-success');

    // Reset alert
    alertErr.classList.add('hidden');
    alertOk.classList.add('hidden');

    if (!email || !password) {
      alertErrMsg.textContent = 'Email dan password wajib diisi.';
      alertErr.classList.remove('hidden');
      return;
    }

    // Loading state
    btnText.textContent = 'Memproses...';
    btnIcon.classList.add('hidden');
    btnSpinner.classList.remove('hidden');

    try {
      await login(email, password);
      alertOk.classList.remove('hidden');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    } catch (err) {
      const msg = err.response?.data?.message || 'Email atau password salah.';
      alertErrMsg.textContent = msg;
      alertErr.classList.remove('hidden');
    } finally {
      btnText.textContent = 'Login';
      btnIcon.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
    }
  });

  // Enter key support
  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });
</script>
</body>
</html>
