<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – Manajemen Kos Al-Firdaus</title>
<link rel="stylesheet" href="/frontend/css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <span class="material-symbols-outlined">home_work</span>
      </div>
      <h1>Al-Firdaus</h1>
      <p>Sistem Manajemen Kos</p>
    </div>

    <div class="auth-title">Masuk ke Akun</div>
    <div class="auth-subtitle">Masukkan kredensial pemilik kos Anda</div>

    <!-- Alert Error -->
    <div id="alert-error" class="alert alert-danger" style="display:none;">
      <span class="material-symbols-outlined">error</span>
      <span id="alert-error-msg">Email atau password salah.</span>
    </div>

    <!-- Alert Success -->
    <div id="alert-success" class="alert alert-success" style="display:none;">
      <span class="material-symbols-outlined">check_circle</span>
      <span>Login berhasil! Mengalihkan…</span>
    </div>

    <!-- Form -->
    <div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="admin@kos.com" autocomplete="email" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required/>
      </div>

      <button class="btn btn-primary" id="btn-login" onclick="doLogin()"
              style="width:100%;justify-content:center;margin-top:8px;">
        <span class="material-symbols-outlined">login</span> Masuk
      </button>
    </div>

    <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:20px;">
      Belum punya akun?
      <a href="/register" style="color:var(--primary);font-weight:600;text-decoration:none;">Daftar di sini</a>
    </p>

  </div>
</div>

<script src="/frontend/js/auth.js"></script>
<script>
// Jika sudah login, redirect
if (localStorage.getItem('token')) {
    window.location.href = '/dashboard';
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
});

async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');

    if (!email || !password) {
        showError('Email dan password wajib diisi.');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Memproses…';
    hideError();

    try {
        await login(email, password);
        document.getElementById('alert-success').style.display = 'flex';
        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
    } catch (err) {
        const msg = err.response?.data?.message || 'Login gagal. Periksa kembali email dan password.';
        showError(msg);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">login</span> Masuk';
    }
}

function showError(msg) {
    document.getElementById('alert-error-msg').textContent = msg;
    document.getElementById('alert-error').style.display = 'flex';
}
function hideError() {
    document.getElementById('alert-error').style.display = 'none';
}
</script>
</body>
</html>
