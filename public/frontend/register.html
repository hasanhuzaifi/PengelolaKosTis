<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daftar – Manajemen Kos Al-Firdaus</title>
<link rel="stylesheet" href="/frontend/css/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <span class="material-symbols-outlined">home_work</span>
      </div>
      <h1>Al-Firdaus</h1>
      <p>Sistem Manajemen Kos</p>
    </div>

    <div class="auth-title">Buat Akun Baru</div>
    <div class="auth-subtitle">Daftarkan akun pemilik kos Anda</div>

    <!-- Alert Error -->
    <div id="alert-error" class="alert alert-danger" style="display:none;">
      <span class="material-symbols-outlined">error</span>
      <span id="alert-error-msg">Terjadi kesalahan.</span>
    </div>

    <!-- Alert Success -->
    <div id="alert-success" class="alert alert-success" style="display:none;">
      <span class="material-symbols-outlined">check_circle</span>
      <span>Akun berhasil dibuat! Mengalihkan ke halaman login…</span>
    </div>

    <!-- Form -->
    <div>
      <div class="form-group">
        <label class="form-label" for="name">Nama Lengkap</label>
        <input class="form-input" id="name" type="text" placeholder="Budi Santoso" autocomplete="name" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="admin@kos.com" autocomplete="email" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password_confirmation">Konfirmasi Password</label>
        <input class="form-input" id="password_confirmation" type="password" placeholder="Ulangi password" autocomplete="new-password" required/>
      </div>

      <button class="btn btn-primary" id="btn-register" onclick="doRegister()"
              style="width:100%;justify-content:center;margin-top:8px;">
        <span class="material-symbols-outlined">person_add</span> Daftar Sekarang
      </button>
    </div>

    <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:20px;">
      Sudah punya akun?
      <a href="/login" style="color:var(--primary);font-weight:600;text-decoration:none;">Masuk di sini</a>
    </p>

  </div>
</div>

<script src="/frontend/js/auth.js"></script>
<script>
if (localStorage.getItem('token')) {
    window.location.href = '/dashboard';
}

async function doRegister() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('password_confirmation').value;
    const btn      = document.getElementById('btn-register');

    if (!name || !email || !password || !confirm) {
        showError('Semua field wajib diisi.');
        return;
    }
    if (password !== confirm) {
        showError('Konfirmasi password tidak cocok.');
        return;
    }
    if (password.length < 8) {
        showError('Password minimal 8 karakter.');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Memproses…';
    hideError();

    try {
        await register(name, email, password);
        document.getElementById('alert-success').style.display = 'flex';
        setTimeout(() => { window.location.href = '/login'; }, 1500);
    } catch (err) {
        const errors = err.response?.data?.errors;
        let msg = err.response?.data?.message || 'Pendaftaran gagal.';
        if (errors) msg = Object.values(errors).flat().join(' ');
        showError(msg);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">person_add</span> Daftar Sekarang';
    }
}

function showError(msg) {
    document.getElementById('alert-error-msg').textContent = msg;
    document.getElementById('alert-error').style.display = 'flex';
}
function hideError() {
    document.getElementById('alert-error').style.display = 'none';
}
</script>
</body>
</html>
