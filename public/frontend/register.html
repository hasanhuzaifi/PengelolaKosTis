<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daftar Akun Baru - Manajemen Kos Al-Firdaus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface-container-lowest": "#ffffff",
          "primary-hover": "#1D4ED8",
          "on-primary": "#ffffff",
          "on-surface-variant": "#434655",
          "border-base": "#E5E7EB",
          "text-main": "#111827",
          "primary-light": "#EFF6FF",
          "primary": "#004ac6",
          "on-surface": "#191b23",
          "bg-canvas": "#F9FAFB",
          "danger": "#DC2626",
          "danger-bg": "#FEF2F2",
          "success": "#16A34A",
          "success-bg": "#F0FDF4",
          "surface-container": "#ededf9",
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: { "stack-md": "16px", "stack-lg": "24px", "stack-sm": "8px", "container-padding": "24px" },
        fontFamily: { body: ["Inter"], "page-title": ["Inter"], "section-title": ["Inter"], "label-muted": ["Inter"] },
        fontSize: {
          "page-title": ["20px", { lineHeight: "28px", fontWeight: "600" }],
          "label-muted": ["12px", { lineHeight: "16px", fontWeight: "400" }],
          "section-title": ["16px", { lineHeight: "24px", fontWeight: "600" }],
          "body": ["14px", { lineHeight: "20px", fontWeight: "400" }],
        }
      }
    }
  }
</script>
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-bg-canvas min-h-screen flex items-center justify-center font-body text-body text-text-main p-container-padding">

<div class="w-full max-w-[400px] bg-surface-container-lowest border border-border-base rounded-lg p-stack-lg shadow-sm">

  <!-- Header -->
  <div class="text-center mb-stack-lg">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-light text-primary mb-stack-sm">
      <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">apartment</span>
    </div>
    <h1 class="font-page-title text-page-title text-on-surface">Daftar Akun Baru</h1>
    <p class="font-body text-body text-on-surface-variant mt-1">Manajemen Kos Al-Firdaus</p>
  </div>

  <!-- Alert Error -->
  <div id="alert-error" class="hidden mb-4 bg-danger-bg border border-danger text-danger text-sm rounded px-4 py-3">
    <ul id="alert-error-list" class="list-disc list-inside space-y-1"></ul>
  </div>

  <!-- Alert Success -->
  <div id="alert-success" class="hidden mb-4 bg-success-bg border border-success text-success text-sm rounded px-4 py-3 flex items-center gap-2">
    <span class="material-symbols-outlined text-[18px]">check_circle</span>
    <span>Akun berhasil dibuat! Mengalihkan ke halaman login...</span>
  </div>

  <!-- Form -->
  <div class="space-y-stack-md">

    <!-- Nama Lengkap -->
    <div>
      <label class="block font-label-muted text-label-muted text-on-surface-variant mb-1" for="nama">Nama Lengkap</label>
      <input class="w-full bg-surface-container-lowest border border-border-base rounded px-3 py-2 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
             id="nama" type="text" placeholder="Nama lengkap Anda"/>
    </div>

    <!-- Email -->
    <div>
      <label class="block font-label-muted text-label-muted text-on-surface-variant mb-1" for="email">Email</label>
      <input class="w-full bg-surface-container-lowest border border-border-base rounded px-3 py-2 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
             id="email" type="email" placeholder="nama@email.com"/>
    </div>

    <!-- Password -->
    <div>
      <label class="block font-label-muted text-label-muted text-on-surface-variant mb-1" for="password">Password</label>
      <input class="w-full bg-surface-container-lowest border border-border-base rounded px-3 py-2 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
             id="password" type="password" placeholder="Minimal 8 karakter"/>
    </div>

    <!-- Konfirmasi Password -->
    <div>
      <label class="block font-label-muted text-label-muted text-on-surface-variant mb-1" for="confirm_password">Konfirmasi Password</label>
      <input class="w-full bg-surface-container-lowest border border-border-base rounded px-3 py-2 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
             id="confirm_password" type="password" placeholder="Ulangi password"/>
    </div>

    <!-- Submit -->
    <button id="btn-register"
            class="w-full bg-primary hover:bg-primary-hover text-on-primary font-section-title text-section-title py-2 px-4 rounded transition-colors duration-200 mt-stack-md flex items-center justify-center gap-2"
            type="button">
      <span id="btn-register-text">Daftar</span>
      <svg id="btn-register-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
    </button>

  </div>

  <!-- Footer -->
  <div class="mt-stack-lg text-center">
    <p class="font-body text-body text-on-surface-variant">
      Sudah punya akun?
      <a class="text-primary hover:text-primary-hover font-semibold transition-colors" href="login.html">Login</a>
    </p>
  </div>

</div>

<script src="js/auth.js"></script>
<script>
  // Jika sudah login, langsung redirect
  if (localStorage.getItem('token')) {
    window.location.href = 'index.html';
  }

  document.getElementById('btn-register').addEventListener('click', async () => {
    const name             = document.getElementById('nama').value.trim();
    const email            = document.getElementById('email').value.trim();
    const password         = document.getElementById('password').value;
    const confirmPassword  = document.getElementById('confirm_password').value;
    const btnText          = document.getElementById('btn-register-text');
    const btnSpinner       = document.getElementById('btn-register-spinner');
    const alertErr         = document.getElementById('alert-error');
    const alertErrList     = document.getElementById('alert-error-list');
    const alertOk          = document.getElementById('alert-success');

    // Reset
    alertErr.classList.add('hidden');
    alertOk.classList.add('hidden');
    alertErrList.innerHTML = '';

    // Validasi sisi client
    const errors = [];
    if (!name)                              errors.push('Nama lengkap wajib diisi.');
    if (!email)                             errors.push('Email wajib diisi.');
    if (!password)                          errors.push('Password wajib diisi.');
    if (password.length < 8)               errors.push('Password minimal 8 karakter.');
    if (password !== confirmPassword)       errors.push('Konfirmasi password tidak cocok.');

    if (errors.length > 0) {
      errors.forEach(msg => {
        const li = document.createElement('li');
        li.textContent = msg;
        alertErrList.appendChild(li);
      });
      alertErr.classList.remove('hidden');
      return;
    }

    // Loading
    btnText.textContent = 'Mendaftar...';
    btnSpinner.classList.remove('hidden');

    try {
      await register(name, email, password);
      alertOk.classList.remove('hidden');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      const data = err.response?.data;
      if (data?.errors) {
        // Validasi dari Laravel
        Object.values(data.errors).flat().forEach(msg => {
          const li = document.createElement('li');
          li.textContent = msg;
          alertErrList.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = data?.message || 'Terjadi kesalahan. Coba lagi.';
        alertErrList.appendChild(li);
      }
      alertErr.classList.remove('hidden');
    } finally {
      btnText.textContent = 'Daftar';
      btnSpinner.classList.add('hidden');
    }
  });
</script>
</body>
</html>
