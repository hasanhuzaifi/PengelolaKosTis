<script>
const API_URL = 'http://localhost:8000/api';
const token = localStorage.getItem('token');
let currentModalMode = 'add'; // 'add' atau 'edit'
let currentKamarId = null;

// Load kamar saat page dimuat
document.addEventListener('DOMContentLoaded', function() {
    loadKamar();
});

async function loadKamar() {
    try {
        const response = await axios.get(`${API_URL}/kamar`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const kamarContainer = document.getElementById('kamarContainer');
        kamarContainer.innerHTML = '';
        
        response.data.data.forEach(kamar => {
            const statusBg = kamar.status === 'tersedia' ? 'bg-success-bg text-success' : 'bg-warning-bg text-warning';
            const statusText = kamar.status === 'tersedia' ? 'TERSEDIA' : 'TERISI';
            const fasilitas = kamar.fasilitas || [];
            
            const card = document.createElement('div');
            card.className = 'bg-surface-container-lowest border border-border-base rounded-lg p-6 flex flex-col relative overflow-hidden group';
            card.innerHTML = `
                <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-primary-light to-transparent opacity-50 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                <div class="flex justify-between items-start mb-4 relative z-10">
                    <div>
                        <span class="font-stat-number text-stat-number text-text-main block">${kamar.nomor_kamar}</span>
                        <span class="font-label-muted text-label-muted text-on-surface-variant uppercase tracking-wider">${kamar.tipe}</span>
                    </div>
                    <span class="${statusBg} px-3 py-1 rounded-full font-label-muted text-label-muted font-semibold border border-opacity-20">${statusText}</span>
                </div>
                <div class="mb-4 relative z-10">
                    <span class="font-section-title text-section-title text-primary block mb-1">Rp ${parseInt(kamar.harga_per_bulan).toLocaleString('id-ID')}<span class="text-on-surface-variant font-body text-body font-normal">/bulan</span></span>
                </div>
                <div class="mb-6 flex-1 relative z-10">
                    ${fasilitas.map(f => `
                        <div class="flex items-center gap-2 text-on-surface-variant font-body text-body mb-2">
                            <span class="material-symbols-outlined text-[18px]">check_circle</span>
                            <span>${f}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="flex gap-3 pt-4 border-t border-border-base relative z-10">
                    <button class="flex-1 border border-border-base text-text-main hover:bg-surface-container-low px-4 py-2 rounded-lg font-body text-body transition-colors duration-200" onclick="editKamar(${kamar.id})">Edit</button>
                    <button class="flex-1 border border-danger text-danger hover:bg-danger-bg px-4 py-2 rounded-lg font-body text-body transition-colors duration-200" onclick="deleteKamar(${kamar.id})">Hapus</button>
                </div>
            `;
            kamarContainer.appendChild(card);
        });
    } catch (error) {
        alert('Gagal memuat data kamar: ' + error.message);
    }
}

function openModal() {
    currentModalMode = 'add';
    currentKamarId = null;
    document.getElementById('modalTitle').textContent = 'Tambah Kamar Baru';
    document.getElementById('kamarForm').reset();
    document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
}

async function editKamar(id) {
    try {
        const response = await axios.get(`${API_URL}/kamar/${id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const kamar = response.data.data;
        currentModalMode = 'edit';
        currentKamarId = id;
        document.getElementById('modalTitle').textContent = 'Edit Kamar';
        
        document.getElementById('nomor_kamar').value = kamar.nomor_kamar;
        document.getElementById('tipe').value = kamar.tipe;
        document.getElementById('harga_per_bulan').value = kamar.harga_per_bulan;
        document.getElementById('status').value = kamar.status;
        
        // Set fasilitas checkboxes
        document.querySelectorAll('[data-fasilitas]').forEach(checkbox => {
            checkbox.checked = kamar.fasilitas && kamar.fasilitas.includes(checkbox.value);
        });
        
        document.getElementById('modalOverlay').classList.remove('hidden');
    } catch (error) {
        alert('Gagal memuat data kamar: ' + error.message);
    }
}

async function saveKamar() {
    try {
        const fasilitas = Array.from(document.querySelectorAll('[data-fasilitas]:checked')).map(cb => cb.value);
        
        const data = {
            nomor_kamar: document.getElementById('nomor_kamar').value,
            tipe: document.getElementById('tipe').value,
            harga_per_bulan: parseFloat(document.getElementById('harga_per_bulan').value),
            fasilitas: fasilitas,
            status: document.getElementById('status').value
        };
        
        if (currentModalMode === 'add') {
            await axios.post(`${API_URL}/kamar`, data, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            alert('Kamar berhasil ditambahkan');
        } else {
            await axios.put(`${API_URL}/kamar/${currentKamarId}`, data, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            alert('Kamar berhasil diperbarui');
        }
        
        closeModal();
        loadKamar();
    } catch (error) {
        alert('Gagal menyimpan kamar: ' + error.response?.data?.message || error.message);
    }
}

async function deleteKamar(id) {
    if (confirm('Apakah Anda yakin ingin menghapus kamar ini?')) {
        try {
            await axios.delete(`${API_URL}/kamar/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            alert('Kamar berhasil dihapus');
            loadKamar();
        } catch (error) {
            alert('Gagal menghapus kamar: ' + error.message);
        }
    }
}

function logout() {
    localStorage.removeItem('token');
    window.location.href = 'login.html';
}
</script>
